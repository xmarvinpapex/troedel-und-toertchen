});

/* ================= Darstellung: Start ================= */
/* ================= Startseite: Spielbrett mit Café-Karte ================= */
const ROWN = 4, ROWH = 96, BPAD = 70;
const COLS = [20, 40, 60, 80];
// Jedes Kapitel bekommt eine eigene Farbe und eigene Deko, damit das Brett abwechslungsreich bleibt
const ZONES = [
  { c1: "#bfe0a0", c2: "#a6d18a", d: ["☕", "🧁", "🌷"] }, { c1: "#b4dca8", c2: "#97c98e", d: ["🌳", "💬", "🌻"] },
  { c1: "#d6e2a0", c2: "#bfd385", d: ["🍰", "🫖", "🌼"] }, { c1: "#b8d8c4", c2: "#9cc6ae", d: ["🗝️", "📚", "🕯️"] },
  { c1: "#c8d6a8", c2: "#adc48c", d: ["🕰️", "🔒", "🌿"] }, { c1: "#e0d8a8", c2: "#cdc28a", d: ["📷", "🎩", "🧭"] },
  { c1: "#e6d0b8", c2: "#d6b896", d: ["🎉", "🎀", "🍓"] }, { c1: "#c4d8e0", c2: "#a8c4d0", d: ["🍂", "❄️", "🌸"] },
  { c1: "#ddd3ee", c2: "#c6badf", d: ["🗼", "🥐", "🪗"] }
];
const zoneOf = n => ZONES[Math.floor((n - 1) / 10) % ZONES.length];
function boardPos(n, H) {
  const i = n - 1, r = Math.floor(i / ROWN), k = i % ROWN;
  return { x: COLS[r % 2 ? ROWN - 1 - k : k], y: H - BPAD - r * ROWH };
}
const homeIcon = (id, ico, label, badge, cls = "") => `<button class="hround ${cls}" id="${id}" aria-label="${label}">${ico}${badge ? `<span class="badge">${badge}</span>` : ""}</button>`;
function renderHome() {
  G = null;
  const room = currentRoom();
  setScreenAudio(room.id);
  const done = room.ups.filter(u => save.owned.includes(u.id)).length;
  const g = nextGoal();
  const cur = Math.min(save.level, MAX_LEVEL + 1), maxAll = Math.max(24, Math.ceil((cur + 8) / ROWN) * ROWN);
  const maxN = Math.min(maxAll, MAX_LEVEL), atEnd = maxAll > MAX_LEVEL;
  const rows = Math.ceil(Math.min(maxAll, MAX_LEVEL + 1) / ROWN), H = BPAD * 2 + (rows - 1) * ROWH + 40;
  const from = Math.min(save.mapPos || cur, cur);
  // Felder, Schilder, Deko
  let cells = "", zones = "", deco = "";
  for (let c = 0; c * 10 < maxN; c++) {
    const top = boardPos(Math.min(maxN, c * 10 + 10), H).y - ROWH * .55, bot = c ? boardPos(c * 10 + 1, H).y + ROWH * .45 : H;
    const z = ZONES[c % ZONES.length];
    zones += `<div class="bzone" style="top:${Math.max(0, top)}px;height:${bot - Math.max(0, top)}px;background:linear-gradient(${z.c1},${z.c2})"></div>`;
  }
  for (let n = 1; n <= maxN; n++) {
    const p = boardPos(n, H), st = save.best[n] || 0, boss = n % 10 === 0, ms = MILESTONES[n];
    const cls = (n < cur || st ? "done" : n === cur ? "cur" : "locked") + (st && st < 3 ? " miss" : "");
    cells += `<button class="bcell ${cls} ${boss ? "boss" : ""}" data-lv="${n}" style="left:${p.x}%;top:${p.y}px" aria-label="Level ${n}">
      <span class="bn">${boss ? (cls === "locked" ? "🔒" : "🏅") : n}</span>${st ? `<span class="bst">${[1, 2, 3].map(i => `<i class="${i <= st ? "" : "off"}">⭐</i>`).join("")}</span>` : ""}
      ${ms && cls !== "done" ? `<span class="bms" title="${tx(ms[1])}">${ms[0]}</span>` : ""}
      ${(n - 1) % 10 === 0 ? `<span class="bflag">${tx("Kap.")} ${(n - 1) / 10 + 1}${(n - 1) / 10 < SECRET.length && secretFound((n - 1) / 10) ? ` <i class="mclue" data-sec="${(n - 1) / 10}">${SECRET[(n - 1) / 10].e}</i>` : ""}</span>` : ""}</button>`;
    if (n === maxN && atEnd) { const q = boardPos(n + 1, H); cells += `<button class="bsoon" id="bSoon" style="left:${q.x}%;top:${q.y}px"><span>🚧</span><small>${tx("Neue Kapitel kommen bald")}</small></button>`; }
    if (n % ROWN === 2) { const z = zoneOf(n); deco += `<span class="bdeco" style="top:${p.y - 30}px;left:${Math.floor((n - 1) / ROWN) % 2 ? 3 : 91}%">${z.d[(n >> 2) % z.d.length]}</span>`; }
  }
  const fp = boardPos(from, H);
  const e = curEvent(), wk = save.level >= WEEK_FROM ? weekClaimable() : 0;
  const affordable = room.ups.filter(u => !save.owned.includes(u.id) && u.c <= freeStars()).length;
  app.innerHTML = `<div class="screen homemap">
    <div class="hhud">
      <span class="pill">⭐ ${freeStars()}</span><span class="pill" id="hCoins">🪙 ${save.coins}</span><span class="hsp"></span>
      ${save.bonusReady ? homeIcon("hBonus", "⚡", tx("Bonusrunde bereit!"), "!", "bonus") : ""}
      ${puzzleUnlocked() ? homeIcon("hPuzzle", "🧩", tx("Tagesrätsel"), puzzleSolved() ? "" : "1") : ""}
      ${familyOpen() ? homeIcon("hFam", "🏆", tx("Familien-Rätsel"), famSave().tries ? "" : "1") : ""}
      ${e ? homeIcon("hEvent", e.icon, tx(e.n), "") : ""}
      ${save.level >= WEEK_FROM ? homeIcon("hWeek", "📅", tx("Wochenziele"), wk) : ""}
    </div>
    <div class="bwrap" id="bwrap"><div class="board2" style="height:${H}px">${zones}
      <svg class="bpath" aria-hidden="true"><path/></svg>${deco}${cells}
      <div class="btoken" id="bTok" style="left:${fp.x}%;top:${fp.y}px"><span>🧁</span></div></div></div>
    <div class="hsheet">
      <div class="hroom" id="hRoom" role="button" tabindex="0">
        <span class="hmini">${sceneHTML(room)}</span>
        <span class="hrt"><b>${tx(room.n)}</b><small>${TX`${done} von ${room.ups.length} eingerichtet`}</small>
          <span class="gbar"><i style="width:${done / room.ups.length * 100}%"></i></span>
          ${g ? `<em class="${g.have >= g.u.c ? "ready" : ""}">${g.have >= g.u.c ? tx("Jetzt einrichten!") + " " : tx("Nächstes:") + " "}${tx(g.u.n)} · ⭐ ${g.u.c}</em>` : `<em>${tx("Alles eingerichtet!")} 🎉</em>`}</span>
      </div>
      ${save.level > MAX_LEVEL ? `<button class="btn hplay" id="hPlay">🚧 ${tx("Fortsetzung folgt …")}<small>${tx("Neue Kapitel kommen mit dem nächsten Update")}</small></button>`
        : `<button class="btn hplay" id="hPlay">${TX`Level ${save.level} spielen`}<small>${tx("Kapitel")} ${Math.floor((cur - 1) / 10) + 1} · ${chapterName(Math.floor((cur - 1) / 10))}</small></button>`}
    </div>
    <nav class="hnav">
      <button class="on" id="nMap">🗺️<span>${tx("Karte")}</span></button>
      <button id="hShop">🛋️<span>${tx("Einrichten")}</span>${affordable ? `<b class="badge">${affordable}</b>` : ""}</button>
      <button id="hAlbum">📖<span>${tx("Album")}</span>${recipeNew() || cardNew() ? `<i class="ndot"></i>` : ""}</button>
      <button id="hStore">🎁<span>Shop</span>${offerLeft() ? `<b class="badge">1</b>` : ""}</button>
      <button id="hMore">⚙️<span>${tx("Mehr")}</span>${achClaimable() ? `<b class="badge">${achClaimable()}</b>` : ""}</button>
    </nav>
  </div>`;
  // Weg zwischen den Feldern in Bildschirmpunkten
  const bw = app.querySelector(".board2").clientWidth, X = x => x * bw / 100;
  const pts = range(atEnd ? maxN + 1 : maxN).map(i => boardPos(i + 1, H));
  const d = pts.map((p, i) => { if (!i) return `M ${X(p.x)} ${p.y}`; const q = pts[i - 1]; return q.y === p.y ? `L ${X(p.x)} ${p.y}` : `C ${X(q.x) + (q.x > 50 ? 50 : -50)} ${q.y}, ${X(p.x) + (p.x > 50 ? 50 : -50)} ${p.y}, ${X(p.x)} ${p.y}`; }).join(" ");
  const sv = app.querySelector(".bpath"); sv.setAttribute("viewBox", `0 0 ${bw} ${H}`); sv.querySelector("path").setAttribute("d", d);
  // zum aktuellen Feld scrollen
  const wrap = $("#bwrap"), cp = boardPos(cur, H);
  wrap.scrollTop = Math.max(0, cp.y - wrap.clientHeight * .6);
  // Spielfigur hüpft ein Feld weiter, wenn ein neues Level geschafft wurde
  if (from < cur) {
    save.mapPos = cur; persist();
    let n = from;
    const hop = () => { n++; const p = boardPos(n, H), t = $("#bTok"); if (!t) return; t.style.left = p.x + "%"; t.style.top = p.y + "px"; t.classList.remove("hop"); void t.offsetWidth; t.classList.add("hop"); sfx("pick"); if (n < cur) setTimeout(hop, 420); };
    setTimeout(hop, 500);
  } else if (!save.mapPos) { save.mapPos = cur; persist(); }
  $("#hPlay").onclick = () => preLevel(save.level);
  { const sn = $("#bSoon"); if (sn) sn.onclick = openToBeContinued; }
  $("#hRoom").onclick = () => renderShop(null, g && g.have >= g.u.c ? g.u.id : null);
  $("#hRoom").onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); $("#hRoom").click(); } };
  $("#hShop").onclick = () => renderShop(null, g && g.have >= g.u.c ? g.u.id : null);
  $("#hAlbum").onclick = renderAlbum;
  $("#hStore").onclick = openStore;
  $("#hMore").onclick = openMore;
  $("#nMap").onclick = () => { wrap.scrollTo({ top: Math.max(0, cp.y - wrap.clientHeight * .6), behavior: "smooth" }); };
  app.querySelectorAll(".bcell").forEach(b => b.onclick = () => { const n = +b.dataset.lv; if (n > cur) { sfx("tap"); return toast(TX`Schaff zuerst Level ${cur}.`); } preLevel(n); });
  app.querySelectorAll("[data-sec]").forEach(b => b.onclick = ev => { ev.stopPropagation(); showSecret(+b.dataset.sec, null, true); });
  const hp = $("#hPuzzle"); if (hp) hp.onclick = openPuzzle;
  const he = $("#hEvent"); if (he) he.onclick = () => {
    const e = curEvent(), ev = evSave(e);
    if (!ev.introSeen) { ev.introSeen = true; persist(); showLetter(e.letter, { title: tx(e.n), icon: e.icon, btn: tx("Los geht's") }, () => renderEvent()); }
    else renderEvent();
  };
  const hb = $("#hBonus"); if (hb) hb.onclick = startBonus;
  const hw = $("#hWeek"); if (hw) hw.onclick = openWeek;
  const hf = $("#hFam"); if (hf) hf.onclick = openFamily;
  if (!save.introSeen) { setTimeout(() => { if (!$("#ov")) showIntro(() => { if (dailyDue()) openDaily(); }); }, 300); return; }
  if (save.feedbackPending) { save.feedbackPending = false; save.feedbackAsked = true; persist(); setTimeout(() => { if (!$("#ov")) openFeedback(true); }, 450); return; }
  if (newChapterNews()) return;
  if (save.seenVer !== VERSION) {
    const prev = save.seenVer || (save.level > 1 ? "1.3" : VERSION); save.seenVer = VERSION; persist();
    if (prev !== VERSION) { setTimeout(() => { if (!$("#ov") && !G) showNews(prev); }, 450); return; }
  }
  { const c = secretDue(); if (c >= 0) { setTimeout(() => { if (!$("#ov") && !G) showSecret(c, renderHome); }, 450); return; } }
  if (!save.offer && save.level > 10) { save.offer = { until: Date.now() + OFFER_HOURS * 36e5 }; persist(); }
  if (save.offer && !save.offer.shown && offerLeft()) { save.offer.shown = true; persist(); setTimeout(() => { if (!$("#ov") && !G) openOffer(); }, 450); return; }
  if (puzzleUnlocked() && !save.puzzle.intro) { save.puzzle.intro = true; persist(); setTimeout(() => toast(tx("Neu: Das Tagesrätsel 🧩 ist freigeschaltet!")), 500); }
  achCheck();
  if (dailyDue()) setTimeout(() => { if (!G && !$("#ov") && dailyDue()) openDaily(); }, 450);
  else if (save.level >= 10 && !save.backupAsked && !save.backupAt) setTimeout(() => { if (!G && !$("#ov")) backupNudge(); }, 450);
}

const dayKey = (d = new Date()) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const yesterday = () => { const y = new Date(); y.setDate(y.getDate() - 1); return y; };
const dailyDue = () => save.daily.last !== dayKey();
const nextDay = () => save.daily.last === dayKey(yesterday()) ? (save.daily.streak % 7) + 1 : 1;

function openSettings() {
  const o = overlay(`<div class="card">
    <h2>${tx("Einstellungen")}</h2>
    <div class="setrow">${tx("Sprache")} <span class="langsw"><button class="${LANG === "de" ? "on" : ""}" data-lang="de">Deutsch</button><button class="${LANG === "en" ? "on" : ""}" data-lang="en">English</button></span></div>
    <div class="setrow">${tx("Musik")} <button class="switch" id="tMusic" role="switch" aria-checked="${save.music}" aria-label="${tx("Musik")}"></button></div>
    <div class="setrow">${tx("Umgebungsgeräusche")} <button class="switch" id="tAmb" role="switch" aria-checked="${save.ambient}" aria-label="${tx("Umgebungsgeräusche")}"></button></div>
    <div class="setrow">${tx("Soundeffekte")} <button class="switch" id="tSound" role="switch" aria-checked="${save.sound}" aria-label="${tx("Soundeffekte")}"></button></div>
    <div class="setrow">${tx("Vibration")} <button class="switch" id="tVib" role="switch" aria-checked="${save.vibrate}" aria-label="${tx("Vibration")}"></button></div>
    <button class="btn alt" id="tDay">${tx("Testen: Tagesbonus vom nächsten Tag")}</button>
    <button class="btn alt" id="tPuz">${tx("Testen: Tagesrätsel nochmal")}</button>
    <button class="btn alt" id="tEv">${tx("Testen: Saison-Event")}: ${save.evOverride ? tx(evOf(save.evOverride).n) : tx("automatisch")}</button>
    <button class="btn alt" id="tBon">⚡ ${tx("Bonusrunde spielen")}</button>
    <button class="btn alt" id="tNews">✨ ${tx("Was ist neu?")}</button>
    <button class="btn alt" id="tFb">💬 ${tx("Feedback geben")}</button>
    <button class="btn alt" id="tStats">📊 ${tx("Spielstatistik")}</button>
    <button class="btn alt" id="tBackup">💾 ${tx("Spielstand sichern")}</button>
    <button class="btn alt" id="tInst">📲 ${tx("Als App installieren")}</button>
    <button class="btn alt" id="tBoost">${tx("Hilfsmittel erklären")}</button>
    <button class="btn alt" id="tIntro">${tx("Omas ersten Brief nochmal lesen")}</button>
    <button class="btn alt" id="tTod">${tx("Tageszeit:")} ${save.todOverride ? tx(TOD_NAMES[save.todOverride]) : TX`automatisch (${tx(TOD_NAMES[todNow()])})`}</button>
    <button class="btn alt" id="tSeason">${tx("Jahreszeit:")} ${save.seasonOverride ? tx(SEASON_NAMES[save.seasonOverride]) : TX`automatisch (${tx(SEASON_NAMES[seasonNow()])})`}</button>
    <button class="btn alt" id="tReset">${tx("Fortschritt löschen")}</button>
    <button class="btn" id="tClose">${tx("Fertig")}</button>
    <p style="font-size:12px">${tx("Prototyp 2.1 · Werbung und Käufe sind nur simuliert")}<br>${tx("Grafiken: Fluent Emoji von Microsoft (MIT-Lizenz)")}</p>
  </div>`);
  o.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { if (b.dataset.lang === LANG) return; setLang(b.dataset.lang); closeOverlay(); renderHome(); openSettings(); });
  o.querySelector("#tMusic").onclick = e => { save.music = !save.music; persist(); e.currentTarget.setAttribute("aria-checked", save.music); save.music ? musicStart() : musicStop(); };
  o.querySelector("#tAmb").onclick = e => { save.ambient = !save.ambient; persist(); e.currentTarget.setAttribute("aria-checked", save.ambient); const w = amb.want; amb.id = "__"; setAmbience(w); };
  o.querySelector("#tSound").onclick = e => { save.sound = !save.sound; persist(); e.currentTarget.setAttribute("aria-checked", save.sound); sfx("pick"); };
  o.querySelector("#tVib").onclick = e => { save.vibrate = !save.vibrate; persist(); e.currentTarget.setAttribute("aria-checked", save.vibrate); buzz(30); };
  o.querySelector("#tDay").onclick = () => {
    if (!dailyDue()) save.daily.last = dayKey(yesterday());
    persist(); closeOverlay(); openDaily();
  };
  o.querySelector("#tEv").onclick = () => { const ids = [null, ...EVENTS.map(e => e.id)]; save.evOverride = ids[(ids.indexOf(save.evOverride) + 1) % ids.length]; persist(); closeOverlay(); renderHome(); openSettings(); };
  o.querySelector("#tBon").onclick = () => { closeOverlay(); startBonus(); };
  o.querySelector("#tNews").onclick = () => { closeOverlay(); showNews("1.1"); };
  o.querySelector("#tPuz").onclick = () => { if (puzzleSolved()) save.puzzle.last = puzzleNo() - 1; persist(); closeOverlay(); renderHome(); };
  o.querySelector("#tStats").onclick = () => { closeOverlay(); openStats(); };
  o.querySelector("#tBackup").onclick = openBackup;
  o.querySelector("#tInst").onclick = () => { closeOverlay(); openInstall(); };
  o.querySelector("#tBoost").onclick = () => { closeOverlay(); showBoostIntro(); };
  o.querySelector("#tFb").onclick = () => { closeOverlay(); openFeedback(false); };
  o.querySelector("#tIntro").onclick = () => { closeOverlay(); showIntro(() => renderHome()); };
  const cyc = (list, cur) => list[(list.indexOf(cur) + 1) % list.length];
  o.querySelector("#tTod").onclick = () => { save.todOverride = cyc([null, "morgen", "tag", "abend", "nacht"], save.todOverride); persist(); closeOverlay(); renderHome(); openSettings(); };
  o.querySelector("#tSeason").onclick = () => { save.seasonOverride = cyc([null, "fruehling", "sommer", "herbst", "winter"], save.seasonOverride); persist(); closeOverlay(); renderHome(); openSettings(); };
  const r = o.querySelector("#tReset");
  r.onclick = () => {
    if (r.dataset.arm) { const keepLang = save.lang; save = fresh(); save.lang = keepLang; persist(); closeOverlay(); shopRoom = null; renderHome(); toast(tx("Fortschritt gelöscht")); }
    else { r.dataset.arm = "1"; r.textContent = tx("Wirklich löschen? Nochmal tippen"); }
  };
  o.querySelector("#tClose").onclick = () => { closeOverlay(); renderHome(); };
}
function openStore() {
  const packCard = pk => `<div class="pack ${packOwned(pk.id) ? "own" : ""}"><span class="ico">${pk.e}</span>
    <span class="nm">${tx(pk.n)}<small>${tx(pk.d)}</small>${packOwned(pk.id) ? `<label class="dtog"><input type="checkbox" data-deco="${pk.id}" ${decoOn(pk.id) ? "checked" : ""}> ${tx("Deko anzeigen")}</label>` : ""}</span>
    ${packOwned(pk.id) ? `<span class="done">${tx("Gekauft ✓")}</span>` : `<span class="pbtns"><button class="btn small" data-pc="${pk.id}" ${save.coins < pk.coins ? "disabled" : ""}>${pk.coins} 🪙</button><button class="btn small berry" data-pe="${pk.id}">${tx(pk.eur)}</button></span>`}</div>`;
  const o = overlay(`<div class="card">
    <h2>Shop</h2>
    <p>${tx("So könnten die In-App-Käufe aussehen. Im Prototyp ist alles gratis.")}</p>
    ${offerLeft() ? `<h3 class="sth">${tx("Angebot")}</h3>${offerHTML()}` : ""}
    <h3 class="sth">${tx("Deko-Pakete")}</h3>
    ${PACKS.map(packCard).join("")}
    <h3 class="sth">${tx("Münzen & Werbung")}</h3>
    <div class="shop-row"><span class="ico">🚫</span><span class="nm">${tx("Werbung entfernen")}<small>${tx("Keine Zwischenwerbung mehr")}</small></span><button class="btn small" data-p="noads" ${save.noAds ? "disabled" : ""}>${save.noAds ? "✓" : tx("3,99 €")}</button></div>
    <div class="shop-row"><span class="ico">👛</span><span class="nm">${tx("Münzbeutel")}<small>500 🪙</small></span><button class="btn small" data-p="purse">${tx("0,99 €")}</button></div>
    <div class="shop-row"><span class="ico">💰</span><span class="nm">${tx("Münztruhe")}<small>2000 🪙</small></span><button class="btn small" data-p="chest">${tx("2,99 €")}</button></div>
    <button class="btn alt" id="stClose">${tx("Schließen")}</button>
  </div>`);
  const done = (msg) => { persist(); closeOverlay(); if (G) renderGame(); else if ($("#tabs")) renderShop(); else if ($("#ePlay")) renderEvent(); else renderHome(); toast(msg || tx("Demo-Kauf: Im echten Spiel öffnet sich hier Google Play.")); };
  o.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    const p = b.dataset.p;
    if (p === "noads") save.noAds = true;
    if (p === "purse") save.coins += 500;
    if (p === "chest") save.coins += 2000;
    sfx("buy"); done();
  });
  const ob = o.querySelector("#oBuy"); if (ob) ob.onclick = () => { buyStarter(); done(); };
  o.querySelectorAll("[data-pc]").forEach(b => b.onclick = () => {
    const pk = PACKS.find(x => x.id === b.dataset.pc); if (save.coins < pk.coins) return;
    save.coins -= pk.coins; buyPack(pk); done(TX`${tx(pk.n)} gehört dir! Die neuen Farben findest du beim Einrichten.`);
  });
  o.querySelectorAll("[data-pe]").forEach(b => b.onclick = () => { const pk = PACKS.find(x => x.id === b.dataset.pe); buyPack(pk); done(); });
  o.querySelectorAll("[data-deco]").forEach(c => c.onchange = () => { save.decoOff[c.dataset.deco] = !c.checked; persist(); });
  o.querySelector("#stClose").onclick = () => { closeOverlay(); if (!G && $("#hPlay")) renderHome(); };
}

renderSplash();
window.__ttOK = true;
})();
</script>

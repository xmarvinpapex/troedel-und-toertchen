<style>
/* Layout: one-screen phone game. Bottle-green shop wall, oak shelves, brass trim, raspberry for café accents. Deliberately single-theme (evening shop interior). */
:root {
  --wall: #1d3a33;
  --wall-2: #26493f;
  --wall-3: #315a4e;
  --wood: #b0743f;
  --wood-dark: #6f3f1c;
  --wood-shadow: #4a2a12;
  --brass: #e2b04a;
  --brass-dark: #a97a1f;
  --raspberry: #d9506f;
  --paper: #f7ecd6;
  --ink: #23170f;
  --text: #f2eadb;
  --muted: #a9bfb5;
  --slot: 60px;
  --display: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
  --hand: "Caveat", "Segoe Print", cursive;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--wall);
  background-image: repeating-linear-gradient(90deg, transparent 0 46px, rgba(0,0,0,.07) 46px 48px);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.app {
  height: 100%;
  max-width: 540px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

/* ---------- Buttons ---------- */
.btn {
  border: 0; border-radius: 14px; padding: 13px 18px;
  font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .01em;
  background: var(--brass); color: var(--ink);
  box-shadow: 0 4px 0 var(--brass-dark);
  transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brass-dark); }
.btn.alt { background: var(--wall-3); color: var(--text); box-shadow: 0 4px 0 #142a24; }
.btn.berry { background: var(--raspberry); color: #fff; box-shadow: 0 4px 0 #8e2c44; }
.btn.small { font-size: 15px; padding: 9px 12px; border-radius: 11px; }
.btn[disabled] { opacity: .45; cursor: default; }
.ad-tag { display: inline-block; font-family: var(--body); font-size: 11px; font-weight: 800; background: rgba(0,0,0,.25); padding: 1px 6px; border-radius: 6px; margin-left: 4px; vertical-align: 2px; }

/* ---------- Home ---------- */
.home-head { text-align: center; padding-top: 6px; }
.logo { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 10vw, 46px); line-height: .95; margin: 0; color: var(--paper); text-wrap: balance; }
.logo .amp { color: var(--raspberry); }
.tag { color: var(--muted); margin: 6px 0 0; font-weight: 700; }
.stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.pill { background: rgba(0,0,0,.25); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.home-actions { display: grid; gap: 12px; margin-top: auto; }
.footnote { text-align: center; color: var(--muted); font-size: 12px; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 12px; padding: 4px; }

/* ---------- Szenen ---------- */
.scene {
  position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; flex-shrink: 0;
  border-radius: 18px; overflow: hidden; background: #3a2414;
  box-shadow: 0 0 0 4px var(--wood-shadow), 0 10px 24px rgba(0,0,0,.35);
}
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .layer { position: absolute; inset: 0; }
.scene .scimg { position: absolute; transform: translate(-50%, -50%); height: auto; max-width: none; filter: drop-shadow(0 3px 2px rgba(0,0,0,.28)); pointer-events: none; }
.scene .scimg.dirt { transform: none; }
.scene .scimg.b { transform: translate(-50%, -93%); }
.scene .scimg.b.new { transform-origin: 50% 93%; animation: placeInB .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes placeInB { from { transform: translate(-50%, -93%) scale(0); } to { transform: translate(-50%, -93%) scale(1); } }
.scene .cshadow { position: absolute; aspect-ratio: 4 / 1; transform: translate(-50%, -50%); pointer-events: none;
  background: radial-gradient(closest-side, rgba(0,0,0,.4), rgba(0,0,0,0)); }
.scene .scimg.new { animation: placeIn .6s cubic-bezier(.3,1.6,.5,1); }
.scene.dusty svg, .scene.dusty .layer { filter: grayscale(.7) sepia(.35) brightness(.72); }
.scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(25,12,4,.28) 100%); }
.scene .steam { animation: steam 2.6s ease-in-out infinite; }
.scene .pendulum { transform-box: view-box; transform-origin: 336px 190px; animation: swing 1.6s ease-in-out infinite alternate; }
.scene .flicker { animation: flicker 3.2s ease-in-out infinite; }
.scene .mote { transform-box: fill-box; animation: mote 7s ease-in-out infinite; }
.scene .mote:nth-child(2n) { animation-duration: 9s; animation-delay: -3s; }
.scene .water { animation: water 1.4s ease-in-out infinite; }
.scene .sun { animation: sunp 7s ease-in-out infinite; }
.scene .flutter { animation: flutter .5s ease-in-out infinite alternate; }
@keyframes flutter { from { transform: scaleX(1); } to { transform: scaleX(.55); } }
@keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .85; } 100% { opacity: 0; transform: translateY(-9px); } }
@keyframes swing { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
@keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: .8; } 60% { opacity: .95; } }
@keyframes mote { 0%, 100% { transform: translate(0, 0); opacity: .3; } 50% { transform: translate(6px, -10px); opacity: .9; } }
@keyframes water { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
@keyframes sunp { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }

.up-list { display: grid; gap: 8px; overflow-y: auto; min-height: 0; padding-bottom: 4px; }
.up {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  background: var(--wall-2); border-radius: 14px;
}
.up .ico { font-size: 28px; width: 36px; text-align: center; }
.up .nm { flex: 1; min-width: 0; font-weight: 800; }
.up .nm small { display: block; font-weight: 600; color: var(--muted); }
.up .done { color: var(--brass); font-weight: 800; }

/* ---------- Game ---------- */
.topbar { display: flex; align-items: center; gap: 8px; }
.topbar .lvl { font-family: var(--display); font-weight: 800; font-size: 20px; flex: 1; }
.screen > .topbar .lvl { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) { .screen > .topbar { gap: 6px; } .screen > .topbar .pill { padding-inline: 9px; } }
.iconbtn { border: 0; background: var(--wall-2); width: 40px; height: 40px; border-radius: 12px; font-size: 20px; font-weight: 800; }

.guests { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 7px; }
.guest.special { box-shadow: 0 0 0 2.5px var(--raspberry), 0 3px 0 rgba(0,0,0,.25); }
.guest.gold { box-shadow: 0 0 0 2.5px var(--brass), 0 3px 0 rgba(0,0,0,.25); background: #fff4d6; }
.guest .badge { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--raspberry); color: #fff; white-space: nowrap; z-index: 2; }
.guest.gold .badge { background: var(--brass); color: var(--ink); }
.guest .want .prog { font-size: 10px; color: #1d6b46; }
.guest {
  position: relative; background: var(--paper); color: var(--ink); border-radius: 14px;
  padding: 6px 4px 6px; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 56px;
  box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.guest .face { font-size: 30px; }
.guest .want { display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 10px; padding: 2px 6px; }
.guest .want b { font-size: 24px; line-height: 1.1; }
.guest .want span { font-size: 11px; font-weight: 800; color: #6d5a48; }
.guest.empty { background: rgba(0,0,0,.18); box-shadow: none; color: var(--muted); font-size: 12px; font-weight: 700; }
.guest.enter { animation: guestIn .45s cubic-bezier(.3,1.5,.5,1); }
.queue-info { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); min-height: 18px; }
.queue-info .ready { color: var(--brass); }

.board-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.board { display: grid; gap: 14px 12px; justify-content: center; align-content: center; }
.shelf { position: relative; padding: 0 8px; }
.shelf .slots { display: flex; gap: 6px; padding: 6px 6px 0; background: rgba(0,0,0,.22); border-radius: 10px 10px 0 0; }
.shelf .plank {
  height: 12px; margin: 0 -8px; border-radius: 3px;
  background: linear-gradient(var(--wood) 0 55%, var(--wood-dark) 55%);
  box-shadow: 0 5px 8px rgba(0,0,0,.35);
}
.shelf.extra .plank { background: linear-gradient(var(--brass) 0 55%, var(--brass-dark) 55%); }
.depth {
  position: absolute; right: -2px; top: -8px; z-index: 3;
  background: var(--wall-3); color: var(--text); font-size: 11px; font-weight: 800;
  border-radius: 999px; padding: 1px 6px; font-variant-numeric: tabular-nums;
}
.slot {
  position: relative; width: var(--slot); height: calc(var(--slot) * 1.12);
  border: 0; padding: 0; background: transparent; border-radius: 8px;
  display: flex; align-items: flex-end; justify-content: center;
}
.slot .item {
  position: relative; z-index: 2; font-size: calc(var(--slot) * .66); line-height: 1;
  padding-bottom: 2px; transition: transform .15s;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,.35));
}
.slot .ghost {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  font-size: calc(var(--slot) * .42); opacity: .6; filter: saturate(.7) brightness(.9); z-index: 1;
}
.guest { padding-bottom: 12px !important; }
.guest .pat { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 5px; background: rgba(0,0,0,.12); border-radius: 3px; overflow: hidden; }
.guest .pat i { display: block; height: 100%; width: 100%; background: #3f9c6d; transition: width .25s linear; }
.guest .pat i.low { background: var(--raspberry); }
.guest.angry { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.slot.sel .item { transform: translateY(-10px) scale(1.12); }
.slot.sel { background: rgba(226,176,74,.22); }
.slot.target { background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 2px rgba(226,176,74,.5); }
.slot.hint { animation: hintPulse .7s ease-in-out infinite alternate; }
.slot.placed .item { animation: drop .25s ease-out; }
.slot.pop .item { animation: pop .38s ease-in forwards; }
.slot.reveal .item { animation: reveal .3s ease-out; }

.boosters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.boost {
  border: 0; border-radius: 14px; background: var(--wall-2); padding: 8px 2px 7px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 3px 0 #142a24;
}
.boost .bi { font-size: 22px; line-height: 1.1; }
.boost .bl { font-size: 12px; font-weight: 800; }
.boost .bc { font-size: 11px; font-weight: 800; color: var(--brass); }
.boost .bc.ad { color: var(--raspberry); }
.boost[disabled] { opacity: .4; }

.tip {
  background: var(--paper); color: var(--ink); border-radius: 12px; padding: 8px 12px;
  font-weight: 700; font-size: 14px; text-align: center;
}

/* ---------- Overlays ---------- */
.ov {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: rgba(10,22,19,.72);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; overflow-y: auto;
}
.card {
  max-height: calc(100% - 4px); overflow-y: auto; overscroll-behavior: contain;
  width: 100%; max-width: 380px; background: var(--paper); color: var(--ink);
  border-radius: 22px; padding: 22px 20px 20px; text-align: center; display: grid; gap: 12px;
  box-shadow: 0 16px 40px rgba(0,0,0,.45); animation: guestIn .4s cubic-bezier(.3,1.4,.5,1);
}
.card h2 { font-family: var(--display); font-weight: 800; font-size: 28px; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: #5a4636; font-weight: 600; }
.card .btn.alt { background: #e3d3b4; color: var(--ink); box-shadow: 0 4px 0 #b9a47f; }
.stars { font-size: 44px; letter-spacing: 6px; }
.stars .off { filter: grayscale(1); opacity: .3; }
.ad-screen { background: #111; color: #eee; }
.ad-screen .adbox {
  aspect-ratio: 16/9; border-radius: 12px; display: grid; place-items: center; font-size: 15px; font-weight: 800;
  background: repeating-linear-gradient(45deg, #2b2b2b 0 14px, #333 14px 28px); color: #bbb;
}
.ad-screen p { color: #aaa; }
.shop-row { display: flex; align-items: center; gap: 10px; text-align: left; background: #fff; border-radius: 14px; padding: 10px 12px; }
.shop-row .ico { font-size: 28px; }
.shop-row .nm { flex: 1; font-weight: 800; }
.shop-row .nm small { display: block; font-weight: 600; color: #7a6552; }

.float {
  position: fixed; z-index: 60; pointer-events: none; font-weight: 800; font-family: var(--display);
  color: var(--brass); font-size: 20px; text-shadow: 0 2px 0 rgba(0,0,0,.5);
  animation: floatUp 1s ease-out forwards;
}
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 70; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px;
  font-weight: 700; font-size: 14px; max-width: calc(100% - 40px); text-align: center;
  animation: guestIn .3s ease-out;
}

.fly { position: fixed; z-index: 55; pointer-events: none; font-size: 30px; line-height: 1;
  transition: transform .5s cubic-bezier(.5,-0.4,.6,1), opacity .5s ease-in; }
.spark { position: fixed; z-index: 54; pointer-events: none; font-size: 16px; animation: spark .6s ease-out forwards; }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.5); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity: 0; } }
.float.combo { color: var(--raspberry); font-size: 26px; }
.home-head { position: relative; padding-inline: 40px; }
.gear { position: absolute; right: 0; top: 0; }
.tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 0; border-radius: 12px; padding: 9px 12px; background: var(--wall-2); font-weight: 800; white-space: nowrap; }
.tab.on { background: var(--paper); color: var(--ink); }
.tab.locked { opacity: .55; }
.scene.terrace { background: linear-gradient(#bfe2ec 0 40%, #c9725a 40% 44%, #e7d6b8 44% 60%, #a59a8c 60%); }
.scene.terrace::before { inset: 44% 0 40% 0; background: repeating-linear-gradient(90deg, rgba(120,70,40,.16) 0 30px, transparent 30px 34px); }
.scene.terrace::after { inset: 60% 0 0 0; background: radial-gradient(circle, rgba(0,0,0,.13) 0 34%, transparent 36%) 0 0 / 26px 18px; }
.scene.terrace .counter-base { display: none; }
.scene .sun { position: absolute; right: 8%; top: 6%; font-size: clamp(22px, 7vw, 32px); z-index: 1; }
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.day { background: #fff; border-radius: 12px; padding: 8px 4px; display: grid; gap: 2px; font-weight: 800; font-size: 13px; }
.day b { font-size: 12px; color: #7a6552; }
.day.done { opacity: .45; }
.day.today { box-shadow: 0 0 0 3px var(--brass); background: #fff6df; }
.day.big { grid-column: span 2; }
.setrow { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 14px; padding: 12px 14px; font-weight: 800; }
.switch { width: 52px; height: 30px; border-radius: 999px; border: 0; background: #cdbd9f; position: relative; padding: 0; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: #3f9c6d; }
.switch[aria-checked="true"]::after { transform: translateX(22px); }

.splash .fallleaf { transform-box: fill-box; animation: fallleaf 12s linear infinite; }

/* Notfall-Hilfe: Wenn das Spiel nicht startet, statt weißem Bild eine Meldung mit Reparatur-Knopf zeigen */
(function () {
  var errs = [];
  window.addEventListener("error", function (e) { errs.push((e.message || "Fehler") + (e.lineno ? " (Zeile " + e.lineno + ")" : "")); });
  window.addEventListener("unhandledrejection", function (e) { errs.push(String(e.reason && e.reason.message || e.reason)); });
  function repair() {
    var jobs = [];
    try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    Promise.all(jobs).then(go, go);
    function go() { location.replace(location.pathname.replace(/[^/]*$/, "") + "index.html?r=" + Date.now()); }
  }
  setTimeout(function () {
    if (window.__ttOK) return;
    var en = !/^de/i.test(navigator.language || "de");
    var d = document.createElement("div");
    d.setAttribute("style", "position:fixed;inset:0;z-index:99999;background:#1d3a33;color:#fff;font:16px/1.45 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center");
    d.innerHTML = "<div style='font-size:48px'>🧁</div><b style='font-size:20px'>" + (en ? "The game could not start." : "Das Spiel konnte nicht starten.") + "</b>" +
      "<span>" + (en ? "Tap the button. The game will be reloaded fresh – your progress stays." : "Tippe auf den Knopf. Das Spiel wird frisch geladen – dein Spielstand bleibt erhalten.") + "</span>" +
      "<button id='ttFix' style='font:inherit;font-weight:700;padding:12px 22px;border:0;border-radius:14px;background:#e2b04a;color:#2a2116'>" + (en ? "Repair & reload" : "Reparieren & neu laden") + "</button>" +
      "<small style='opacity:.7;max-width:340px;word-break:break-word'>" + (errs.length ? errs.slice(0, 3).join("<br>").replace(/</g, "&lt;").replace(/&lt;br>/g, "<br>") : (en ? "No error message" : "Keine Fehlermeldung")) + " · " + navigator.userAgent.replace(/</g, "") + "</small>";
    document.body.appendChild(d);
    document.getElementById("ttFix").onclick = repair;
  }, 6000);
})();
</script>

function genLevel(n, ev = false, cfgIn = null, seedBase = null) {
  if (ev === true) ev = EVENTS[0];
  const cfg = cfgIn || (ev ? EVENT_LEVELS[Math.min(n, EVENT_LEVELS.length) - 1] : levelCfg(n));
  for (let attempt = 0; attempt < 400; attempt++) {
    const rnd = mulberry32((seedBase !== null ? seedBase : ev ? 900001 + EVENTS.indexOf(ev) * 7001 : 0) + n * 7919 + attempt * 104729 + 17);

    if (cfg.sp.nasch && !pool.some(t => SWEETS.includes(t))) pool[pool.length - 1] = SWEETS[Math.floor(rnd() * SWEETS.length)];
    const setTypes = range(cfg.sets).map(i => pool[i % cfg.types]);
    const items = shuffle(setTypes.flatMap(t => [t, t, t]), rnd);
    const N = items.length, frontSlots = cfg.sh * 3, backSlots = frontSlots * (cfg.ly - 1);
    const maxFront = frontSlots - cfg.fe;
    const minFront = Math.min(maxFront, Math.max(N - backSlots, Math.ceil(frontSlots * .55)));
    const nFront = minFront + Math.floor(rnd() * (maxFront - minFront + 1));
    if (N - nFront > backSlots) continue;
    const shelves = range(cfg.sh).map(() => ({ layers: range(cfg.ly).map(() => [null, null, null]), wrap: [false, false, false], dust: [false, false, false], hot: [0, 0, 0], lock: 0 }));
    const fpos = [], bpos = [];
    range(cfg.sh).forEach(s => range(3).forEach(k => {
      fpos.push([s, 0, k]);
      for (let l = 1; l < cfg.ly; l++) bpos.push([s, l, k]);
    }));
    const pos = shuffle(fpos, rnd).slice(0, nFront).concat(shuffle(bpos, rnd).slice(0, N - nFront));
    pos.forEach(([s, l, k], i) => { shelves[s].layers[l][k] = items[i]; });
    shelves.forEach(sh => {
      sh.layers = [sh.layers[0]].concat(sh.layers.slice(1).filter(l => !allNull(l)));
      while (sh.layers.length > 1 && allNull(sh.layers[0])) sh.layers.shift();
    });
    if (shelves.some(sh => sh.layers.some(isTriple))) continue;
    const empties = shelves.reduce((a, sh) => a + sh.layers[0].filter(x => x === null).length, 0);
    if (empties < 3) continue;
    // Hindernisse: verschlossene Fächer und verpackte Teile
    if (cfg.lk) {
      shuffle(range(cfg.sh).filter(s => !allNull(shelves[s].layers[0])), rnd).slice(0, cfg.lk).forEach(s => shelves[s].lock = 3 + Math.floor(rnd() * 3));
      if (shelves.reduce((a, sh) => a + (sh.lock ? 0 : sh.layers[0].filter(x => x === null).length), 0) < 3) continue;
    }
    if (cfg.wr) {
      const opts = [];
      shelves.forEach((sh, s) => { if (!sh.lock) sh.layers[0].forEach((x, k) => { if (x !== null) opts.push([s, k]); }); });
      shuffle(opts, rnd).slice(0, cfg.wr).forEach(([s, k]) => shelves[s].wrap[k] = true);
    }
    // Spieluhr: nach ein paar Zügen rutscht die vordere Reihe nach hinten
    if (cfg.mb) {
      const c = shuffle(range(cfg.sh).filter(s => !shelves[s].lock && shelves[s].layers.length >= 2), rnd).slice(0, cfg.mb);

      shelves.forEach((sh, s) => { if (!sh.lock && !sh.mbox) sh.layers[0].forEach((x, k) => { if (x !== null && !sh.wrap[k]) opts.push([s, k]); }); });
      shuffle(opts, rnd).slice(0, cfg.du).forEach(([s, k]) => shelves[s].dust[k] = true);
    }
    // Ofenfrisch: heiße Teile kühlen erst ein paar Züge ab
    if (cfg.ho) {
      const opts = [];
      shelves.forEach((sh, s) => { if (!sh.lock && !sh.mbox) sh.layers[0].forEach((x, k) => { if (x !== null && !sh.wrap[k] && !sh.dust[k]) opts.push([s, k]); }); });
      shuffle(opts, rnd).slice(0, cfg.ho).forEach(([s, k]) => shelves[s].hot[k] = 3 + Math.floor(rnd() * 3));
    }
    // Schlüsselfach: öffnet sich, wenn der Gast mit dem Schlüssel bedient ist
    let keyShelf = -1;

      const c = shuffle(range(cfg.sh).filter(s => !shelves[s].lock && !shelves[s].mbox && !allNull(shelves[s].layers[0])), rnd);

    }
    const queue = buildQueue(setTypes, cfg.sp, rnd);
    if (keyShelf >= 0) {
      const out = {};
      shelves.forEach((sh, s) => { if (s !== keyShelf) sh.layers.forEach(l => l.forEach(x => { if (x !== null) out[x] = (out[x] || 0) + 1; })); });
      const q = queue.find((q, i) => i >= 2 && i <= 6 && q.kind !== "boss" && out[q.t] >= 3 * q.need);
      if (!q) continue;
      q.key = true;
    }
    return { shelves, queue, sets: cfg.sets };
  }
}

function buildQueue(setTypes, sp, rnd) {
  const cnt = {};
  setTypes.forEach(t => cnt[t] = (cnt[t] || 0) + 1);
  const types = () => Object.keys(cnt).map(Number);
  let boss = null;
  if (sp.boss) {
    const t = types().sort((a, b) => cnt[b] - cnt[a])[0];
    const need = Math.min(3, cnt[t]); cnt[t] -= need; boss = { t, need, kind: "boss" };
  }
  const multi = [];
  for (let i = 0; i < (sp.sammler || 0); i++) {
    const opts = types().filter(t => cnt[t] >= 2);
    if (!opts.length) break;
    const t = opts[Math.floor(rnd() * opts.length)]; cnt[t] -= 2; multi.push({ t, need: 2, kind: "sammler" });
  }
  const singles = shuffle(types().flatMap(t => Array(cnt[t]).fill(t)), rnd).map(t => ({ t, need: 1, kind: null }));
  for (let i = 0; i < (sp.nasch || 0); i++) { const q = singles.find(q => !q.kind && SWEETS.includes(q.t)); if (q) q.kind = "nasch"; }
  for (let i = 0; i < (sp.eilig || 0); i++) { const q = singles.find(q => !q.kind); if (q) q.kind = "eilig"; }
  for (let i = 0; i < (sp.kritiker || 0); i++) { const q = [...singles].reverse().find(q => !q.kind); if (q) q.kind = "kritiker"; }
  const all = shuffle(multi.concat(singles), rnd);
  // Die ersten zwei Gäste sind normale Gäste, damit der Start ruhig bleibt
  for (let i = 0; i < Math.min(2, all.length); i++) if (all[i].kind) {
    const j = all.findIndex((q, k) => k > 2 && !q.kind);
    if (j > 0) [all[i], all[j]] = [all[j], all[i]];
  }
  // Der erste Sondergast kommt früh, damit man ihn gleich kennenlernt
  const fi = all.findIndex(q => q.kind);
  if (fi > 3) { const [x] = all.splice(fi, 1); all.splice(3, 0, x); }
  if (boss) all.splice(Math.max(3, Math.floor(all.length * .6)), 0, boss);
  return all.map((q, i) => ({ ...q, id: i, got: 0, g: q.kind ? KINDS[q.kind].g : GUESTS[Math.floor(rnd() * GUESTS.length)] }));
}
const patienceOf = (q, base) => Math.round(base * (q.kind ? KINDS[q.kind].pf : 1));

const PRE = [
  { id: "geduld", e: "⏳", n: "Geduld+", d: "Gäste warten 50 % länger", c: 100 },
  { id: "herz", e: "💝", n: "Extra-Herz", d: "Du startest mit 4 statt 3 Herzen", c: 90 },
  { id: "fach", e: "🧺", n: "Startfach", d: "Ein leeres Extra-Fach von Anfang an", c: 120 }
];
let preSel = new Set();
// Vor dem Level: Start-Booster für Münzen auswählen (ab Level 4 und im Wintermarkt)
function preLevel(n, ev = false, mode = null) {
  if (ev === true) ev = curEvent() || EVENTS[0];
  if (save.feedbackPending) { save.feedbackPending = false; save.feedbackAsked = true; persist(); return openFeedback(true, () => preLevel(n, ev, mode)); }
  if (mode === "bonus") return startLevel(n, false, {}, "bonus");
  if (mode === "family") { famSave(); return startLevel(n, false, {}, "family"); }
  if (!ev && !mode && n > MAX_LEVEL) return openToBeContinued();
  if (!ev && !mode && CH_INTRO[n] && !(save.chIntro || []).includes(n)) {
    save.chIntro = (save.chIntro || []).concat(n); persist(); const ci = CH_INTRO[n];
    return showLetter(ci.t, { title: tx("Ein Brief aus Paris"), icon: ci.e, sign: ci.from, btn: tx("Ich helfe dir!") }, () => preLevel(n, ev, mode));
  }
  if (!ev && !mode && n >= 4 && ((save.fails || {})[n] || 0) >= OMA_HELP_AFTER) return omaHelp(n);
  if (!ev && !mode && n < 4) return startLevel(n, ev);
  const total = () => PRE.filter(b => preSel.has(b.id) && !save.inv[b.id]).reduce((a, b) => a + b.c, 0);
  const draw = () => {
    const tt = total();
    const o = overlay(`<div class="card">
      <h2>${mode === "daily" ? tx("Tagesrätsel") + " #" + n : ev ? tx(ev.n) + " " + n : "Level " + n}</h2>
      ${mode === "daily" ? `<p>${TX`Heute ${tx(PUZZLE_DIFF[puzzleHard(n)])} · für alle Spieler gleich`}</p>` : ""}
      <p>${tx("Start-Booster für dieses Level (freiwillig)")}</p>
      <div class="prelist">${PRE.map(b => `<button class="prebtn ${preSel.has(b.id) ? "on" : ""}" data-pre="${b.id}">
        <span class="pe">${b.e}</span><span class="pn"><b>${tx(b.n)}</b><small>${tx(b.d)}</small></span><span class="pc">${save.inv[b.id] ? TX`Gratis (${save.inv[b.id]}×)` : b.c + " 🪙"}</span></button>`).join("")}</div>
      <p class="preb">${tx("Dein Guthaben:")} 🪙 ${save.coins}</p>
      <button class="btn" id="preGo" ${tt > save.coins ? "disabled" : ""}>${tx("Los geht's")}${tt ? ` · ${tt} 🪙` : ""}</button>
      <button class="btn alt" id="preNo">${tx("Zurück")}</button>
    </div>`);
    o.querySelectorAll("[data-pre]").forEach(b => b.onclick = () => { const id = b.dataset.pre; preSel.has(id) ? preSel.delete(id) : preSel.add(id); sfx("pick"); draw(); });
    o.querySelector("#preNo").onclick = () => { closeOverlay(); preSel.clear(); };
    o.querySelector("#preGo").onclick = () => {
      const t2 = total(); if (t2 > save.coins) return;
      const bo = {}; preSel.forEach(id => { bo[id] = true; if (save.inv[id]) save.inv[id]--; });
      save.coins -= t2; persist(); preSel.clear(); closeOverlay();
      if (t2) sfx("buy");
      startLevel(n, ev, bo, mode);
    };
  };
  draw();
}

function startLevel(n, ev = false, bo = {}, mode = null) {
  if (G) statEnd(G.over ? "l" : "q");
  if (ev === true) ev = curEvent() || EVENTS[0];
  const daily = mode === "daily";
  const bonus = mode === "bonus", fam = mode === "family";
  const lv = fam ? genLevel(n, false, familyCfg(n), 800009) : daily ? genLevel(n, false, puzzleCfg(n), 500009) : bonus ? genLevel(n, false, bonusCfg(), 700001) : genLevel(n, ev);
  const hearts = bo.herz ? 4 : 3;
  G = { n, ev, daily, bonus: bonus ? { left: BONUS_TIME } : null, shelves: lv.shelves, queue: lv.queue, sets: lv.sets, moves: 0, levelCoins: 0, extraUsed: false, history: [],
        hearts, maxHearts: hearts, pMax: bonus || fam ? 0 : Math.round((daily ? puzzleCfg(n).pat : ev ? patienceFor(n + 3) : patienceFor(n)) * (bo.geduld ? 1.5 : 1)),
        over: false, bonusStars: 0, trophy: false, cleared: {}, boosts: bo, helped: Object.keys(bo).length > 0, fam };
  if (bo.fach) G.shelves.push({ layers: [[null, null, null]], extra: true, wrap: [false, false, false], lock: 0 });
  // Erklärungen: Hand in Level 1, hintere Reihen beim ersten Level, in dem es sie gibt
  G.tut1 = !ev && !mode && n === 1 && !save.best[1] ? { clears: 0 } : null;
  G.tutBack = !save.tutBackDone && G.shelves.some(sh => sh.layers.length > 1);
  // Ein neues Hindernis wird beim ersten Mal (und beim Neustart desselben Levels) erklärt
  const lkey = (daily ? "d" : ev ? "w" : "") + n;
  const has = { du: G.shelves.some(sh => sh.dust && sh.dust.some(Boolean)), mb: G.shelves.some(sh => sh.mbox), ky: G.shelves.some(sh => sh.key) };
  const newOb = ["du", "mb", "ky"].find(k => has[k] && (!save.seenOb[k] || save.seenOb[k] === lkey));
  if (newOb) { save.seenOb[newOb] = lkey; persist(); G.obTip = OB_TIPS[newOb]; }
  // Ab Level 6 kommt ein Stammgast mit dem nächsten Kapitel seiner Geschichte
  const open = REGULARS.filter(r => (save.regulars[r.id] || 0) < r.s.length);
  if (!ev && !mode && n >= 6 && open.length) {
    const r = open[n % open.length];
    const q = G.queue.find((x, i) => i >= 2 && i <= 6 && !x.kind && x.need === 1);
    if (q) { q.kind = "stamm"; q.reg = r.id; q.g = r.g; q.name = r.n; }
  }
  if (G.pMax) G.queue.slice(0, 3).forEach((q, i) => { q.pm = patienceOf(q, G.pMax * (1 + .5 * i)); q.p = q.pm; });
  sel = null; busy = false; fx = { placed: null, pop: new Set(), reveal: new Set(), hint: null, unlock: new Set(), unwrap: new Set(), dusted: null };
  seenGuests = new Set();
  statStart(); if (Object.keys(bo).length) statHelp("b");
  renderGame();
  if (!ev && !mode && n >= 2 && !save.boostIntro) { save.boostIntro = true; persist(); setTimeout(() => { if (G && !$("#ov")) showBoostIntro(); }, 500); }
}
const front = s => G.shelves[s].layers[0];
const snapshot = () => ({ shelves: clone(G.shelves), queue: clone(G.queue), moves: G.moves, levelCoins: G.levelCoins, bonusStars: G.bonusStars, trophy: G.trophy, cleared: clone(G.cleared) });
const isWrapped = (s, k) => !!(G.shelves[s].wrap && G.shelves[s].wrap[k]);
const isHot = (s, k) => !!(G.shelves[s].hot && G.shelves[s].hot[k] > 0 && front(s)[k] !== null);
const hotMsg = (s, k) => { sfx("tap"); toast(TX`Noch heiß! In ${G.shelves[s].hot[k]} Zügen ist es abgekühlt.`); };
const coolAll = sh => { sh.hot = [0, 0, 0]; };
const isDusty = (s, k) => !!(G.shelves[s].dust && G.shelves[s].dust[k] && front(s)[k] !== null);
const retryLevel = () => preLevel(G.n, G.ev, G.daily ? "daily" : G.bonus ? "bonus" : G.fam ? "family" : null);
function dustOff(s, k) {
  G.shelves[s].dust[k] = false; sel = null; fx.dusted = { s, k };
  save.stats.dust++; sfx("dust"); buzz(6); renderBoard();
  setTimeout(() => { if (fx.dusted && fx.dusted.s === s && fx.dusted.k === k) fx.dusted = null; }, 400);
}
function neighbors(s, cols) {
  const n = G.shelves.length, r = [s, s - cols, s + cols];
  if (cols === 2) r.push(s % 2 ? s - 1 : s + 1);
  return r.filter(j => j >= 0 && j < n);
}

function tapSlot(s, k) {
  if (busy) return;
  fx.hint = null;
  const item = front(s)[k];
  if (G.shelves[s].lock) { sfx("tap"); toast(G.shelves[s].key ? tx("Dieses Fach öffnet sich, sobald du den Gast mit dem Schlüssel 🗝️ bedient hast.") : TX`Dieses Fach ist verschlossen. Noch ${G.shelves[s].lock} Sets abräumen!`); return; }
  const wrapMsg = () => { sfx("tap"); toast(tx("Verpackt! Räume ein Fach direkt daneben ab, dann packt es sich aus.")); };
  if (!sel) {
    if (item !== null) { if (isWrapped(s, k)) return wrapMsg(); if (isHot(s, k)) return hotMsg(s, k); if (isDusty(s, k)) return dustOff(s, k); sel = { s, k }; sfx("pick"); renderBoard(); }
    return;
  }
  if (sel.s === s && sel.k === k) { sel = null; renderBoard(); return; }
  const f = front(s);
  let target = null;
  if (item === null) target = k;
  else if (s !== sel.s) { const e = f.indexOf(null); if (e >= 0) target = e; }
  if (target === null) {
    if (item !== null) { if (isWrapped(s, k)) return wrapMsg(); if (isHot(s, k)) return hotMsg(s, k); if (isDusty(s, k)) return dustOff(s, k); sel = { s, k }; sfx("pick"); renderBoard(); }
    return;
  }
  doMove(sel.s, sel.k, s, target);
}

function doMove(s, k, t, kt) {
  G.history.push(snapshot());
  if (G.history.length > 30) G.history.shift();
  fx.unlock.clear(); fx.unwrap.clear();
  front(t)[kt] = front(s)[k];
  front(s)[k] = null;
  G.moves++;
  G.shelves.forEach(sh => { if (sh.mbox && sh.layers.length > 1) sh.mleft--; });
  G.shelves.forEach((sh, i) => { if (sh.hot && sh.hot.some(v => v > 0)) { sh.hot = sh.hot.map(v => Math.max(0, v - 1)); if (!sh.hot.some(v => v > 0)) fx.unwrap.add(i); } });
  sel = null;
  sfx("place"); buzz(8);
  fx.placed = { s: t, k: kt };
  resolve(s === t ? [t] : [t, s]);
}

function advance(i) {
  const sh = G.shelves[i];
  if (sh.layers.length > 1 && allNull(sh.layers[0])) {
    sh.layers.shift(); sh.wrap = [false, false, false]; sh.dust = [false, false, false]; coolAll(sh); fx.reveal.add(i);
    if (G.tutBack) { G.tutBack = false; save.tutBackDone = true; persist(); setTimeout(() => tutNote(i, "Genau so! Das Fach war leer – jetzt sind die Teile von hinten nach vorn gerückt."), 420); }
    return true;
  }
  return false;
}

function resolve(touched) {
  busy = true;
  const clears = touched.filter(s => isTriple(front(s)));
  if (clears.length) {
    clears.forEach(s => fx.pop.add(s));
    if (G.tut1) { if (!G.tut1.clears) setTimeout(() => toast(tx("Super! Drei gleiche Teile gehen direkt an den Gast.")), 350); G.tut1.clears += clears.length; }
    G.combo = (G.lastClear !== undefined && G.moves - G.lastClear <= 2) ? (G.combo || 1) + 1 : 1;
    save.stats.sets += clears.length; save.stats.combo = Math.max(save.stats.combo, G.combo);
    weekAdd("sets", clears.length); clears.forEach(s => weekAdd("item:" + front(s)[0])); if (G.combo >= 2) weekAdd("combo");
    G.lastClear = G.moves;
    renderBoard();
    sfx("clear", G.combo); buzz(25);
    clears.forEach(s => sparks(document.querySelector(`.shelf[data-s="${s}"]`)));
    if (G.combo >= 2) {
      const bonus = 5 * (G.combo - 1);
      G.levelCoins += bonus;
      floatText(TX`Kombo ×${G.combo}! +${bonus} 🪙`, $("#board"), "combo");
    }
    setTimeout(() => {
      clears.forEach(s => {
        const t = front(s)[0];
        G.cleared[t] = (G.cleared[t] || 0) + 1;
        G.shelves[s].layers[0] = [null, null, null];
        G.shelves[s].wrap = [false, false, false]; G.shelves[s].dust = [false, false, false]; coolAll(G.shelves[s]);
        fx.pop.delete(s);
        serve(t, s);
      });
      const cols = layout().cols;
      clears.forEach(s => neighbors(s, cols).forEach(j => { const w = G.shelves[j].wrap; if (w && w.some(Boolean)) { G.shelves[j].wrap = [false, false, false]; fx.unwrap.add(j); } }));
      G.shelves.forEach((sh, i) => { if (sh.lock && !sh.key) { sh.lock = Math.max(0, sh.lock - clears.length); if (!sh.lock) fx.unlock.add(i); } });
      if (fx.unlock.size) { setTimeout(() => sfx("reveal"), 200); toast(tx("Ein verschlossenes Fach ist jetzt offen!")); }
      if (fx.unwrap.size) setTimeout(() => sfx("pick"), 150);
      fx.placed = null;
      const shifted = range(G.shelves.length).filter(advance);
      renderGame();
      if (shifted.length) { sfx("reveal"); setTimeout(() => { fx.reveal.clear(); resolve(shifted); }, 320); }
      else finish();
    }, 380);
  } else {
    const shifted = touched.filter(advance);
    if (shifted.length) { sfx("reveal"); renderBoard(); setTimeout(() => { fx.reveal.clear(); resolve(shifted); }, 320); }
    else finish();
  }
}

function serve(t, shelfIdx) {
  const shelfEl = document.querySelector(`.shelf[data-s="${shelfIdx}"]`);
  const vis = Math.min(3, G.queue.length);
  let i = G.queue.findIndex((q, idx) => idx < vis && q.t === t && q.got < q.need);
  if (i >= 0) {
    const q = G.queue[i];
    const gEl = document.querySelector(`.guest[data-id="${q.id}"]`);
    fly(ITEMS[t].e, shelfEl, gEl);
    q.got++;
    if (q.got >= q.need) completeGuest(q, true, shelfEl);
    else { floatText(TX`${q.got}/${q.need} – weiter so!`, gEl); setTimeout(() => sfx("coin"), 420); }
  } else {
    i = G.queue.findIndex(q => q.t === t && q.got < q.need);
    if (i >= 0) { fly(ITEMS[t].e, shelfEl, $("#qinfo")); G.queue[i].got++; G.levelCoins += 5; floatText(tx("+5 🪙 auf die Theke"), shelfEl); }
  }
  // Gäste, deren Bestellung schon komplett auf der Theke steht, nehmen sie mit
  let changed = true;
  while (changed) {
    changed = false;
    for (let j = 0; j < Math.min(3, G.queue.length); j++) if (G.queue[j].got >= G.queue[j].need) { completeGuest(G.queue[j], false, shelfEl); changed = true; break; }
  }
}
function completeGuest(q, direct, el) {
  G.queue.splice(G.queue.indexOf(q), 1);
  setTimeout(() => sfx("coin"), 420);
  save.stats.guests++; weekAdd("guests"); if (q.kind) weekAdd("kind:" + q.kind);
  if (q.key) {
    G.shelves.forEach((sh, i) => { if (sh.key) { sh.key = false; sh.lock = 0; fx.unlock.add(i); } });
    setTimeout(() => sfx("reveal"), 250); toast(tx("Der Gast hat dir das Schlüsselfach aufgeschlossen!"));
  }
  const fast = !G.pMax || q.p === undefined || q.p / (q.pm || G.pMax) >= .5 || !direct;
  let coins = direct ? 15 : 0, extra = "";
  if (q.kind === "sammler") coins = direct ? 40 : 20;
  if (q.kind === "eilig" && direct) coins = 30;
  if (q.kind === "boss") { coins = 100; G.trophy = true; extra = " 🏆"; setTimeout(() => sfx("win"), 300); }
  if (q.kind === "nasch" && G.pMax && G.hearts < (G.maxHearts || 3)) { G.hearts++; extra = " +1 ❤️"; }
  if (q.kind === "kritiker" && fast) { G.bonusStars++; extra = " +1 ⭐"; save.stats.critic++; }
  if (q.kind === "stamm") { coins = direct ? 25 : 10; G.stammDone = q.reg; extra = " 💬"; }
  G.levelCoins += coins;
  if (coins || extra) floatText((coins ? `+${coins} 🪙` : "") + extra + (direct ? " " + tx("Danke!") : ""), el, q.kind ? "combo" : "");
}

function finish() {
  busy = false; setTimeout(tutUpdate, 60); fx.reveal.clear(); fx.placed = null;
  // Spieluhren, die jetzt dran sind, spielen: vordere Reihe nach hinten
  const spin = range(G.shelves.length).filter(i => { const sh = G.shelves[i]; return sh.mbox && !sh.lock && sh.layers.length > 1 && sh.mleft <= 0; });
  spin.forEach(i => { const sh = G.shelves[i]; sh.layers.push(sh.layers.shift()); sh.mleft = sh.mbox; sh.wrap = [false, false, false]; sh.dust = [false, false, false]; coolAll(sh); fx.reveal.add(i); });
  // Geht gar nichts mehr außer heißen Teilen, kühlen sie sofort ab (damit man nie feststeckt)
  if (G.shelves.some(sh => sh.hot && sh.hot.some(v => v > 0)) && !findHint()) G.shelves.forEach(coolAll);
  if (spin.length) { sfx("musicbox"); setTimeout(() => { fx.reveal.clear(); }, 400); }
  renderGame();
  if (G.queue.length === 0 && G.shelves.every(sh => sh.layers.every(allNull))) return setTimeout(win, 350);
  const free = G.shelves.some(sh => !sh.lock && sh.layers[0].includes(null));
  if (!free) setTimeout(stuck, 300);
}

/* ================= Geduld der Gäste ================= */
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(); const dt = Math.min(.5, (now - lastTick) / 1000); lastTick = now;
  if (G && G.bonus && !G.over && !$("#ov") && !document.hidden && $("#guests")) return bonusTick(dt);
  if (!G || !G.pMax || G.over || $("#ov") || document.hidden || !$("#guests")) return;
  let angry = null;
  G.queue.slice(0, 3).forEach(q => {
    if (q.p === undefined) { q.pm = patienceOf(q, G.pMax); q.p = q.pm; }
    q.p -= dt;
    if (q.p <= 0 && !angry) angry = q;
  });
  if (angry) guestLeaves(angry); else updateBars();
}, 250);
function updateBars() {
  G.queue.slice(0, 3).forEach(q => {
    const bar = document.querySelector(`.guest[data-id="${q.id}"] .pat i`);
    if (!bar || q.p === undefined) return;
    const r = Math.max(0, q.p / (q.pm || G.pMax));
    bar.style.width = (r * 100) + "%";
    bar.classList.toggle("low", r < .3);
  });
}
function guestLeaves(q) {
  const el = document.querySelector(`.guest[data-id="${q.id}"]`);
  if (el) el.classList.add("angry");
  floatText(tx("💔 Gast ist gegangen"), el);
  sfx("angry"); buzz(120);
  G.queue.splice(G.queue.indexOf(q), 1);
  q.p = undefined;
  G.queue.push(q);           // kommt später wieder
  G.hearts--;
  if (G.hearts <= 0) { G.over = true; setTimeout(() => { renderGame(); lose(); }, 450); }
  else setTimeout(renderGame, 400);
}
function lose() {
  sfx("lose");
  if (!G.ev && !G.daily && !G.bonus && !G.fam) { save.fails = save.fails || {}; save.fails[G.n] = (save.fails[G.n] || 0) + 1; persist(); }
  const o = overlay(`<div class="card">
    <h2>${tx("Die Gäste sind verärgert")}</h2>
    <p>${tx("Drei Gäste haben den Laden ohne ihre Bestellung verlassen.")}</p>
    <button class="btn berry" id="lCont">${tx("Weiterspielen mit 2 ❤️")} <span class="ad-tag">▶ ${tx("Werbung")}</span></button>
    <button class="btn alt" id="lRe">${tx("Level neu starten")}</button>
    <button class="btn alt" id="lHome">${tx("Zum Laden")}</button>
  </div>`);
  o.querySelector("#lCont").onclick = () => { closeOverlay(); showAd("reward", () => {
    G.helped = true; statHelp("c"); G.hearts = 2; G.over = false; G.queue.slice(0, 3).forEach((q, i) => { q.pm = patienceOf(q, G.pMax * (1 + .5 * i)); q.p = q.pm; }); renderGame(); }); };
  o.querySelector("#lRe").onclick = () => { closeOverlay(); retryLevel(); };
  o.querySelector("#lHome").onclick = () => { closeOverlay(); statEnd("l"); G.ev ? renderEvent() : renderHome(); };
}

/* ================= Booster ================= */
function findHint() {
  const F = G.shelves.map(sh => sh.lock ? [-2, -2, -2] : sh.layers[0].map((x, k) => ((sh.wrap && sh.wrap[k]) || (sh.dust && sh.dust[k]) || (sh.hot && sh.hot[k] > 0)) && x !== null ? -1 : x));
  const cnt = (f, t) => f.filter(x => x === t).length;
  const emp = f => f.filter(x => x === null).length;
  for (let t = 0; t < F.length; t++) {
    for (const c of new Set(F[t].filter(x => x !== null && x >= 0))) {
      if (cnt(F[t], c) === 2 && emp(F[t]) === 1)
        for (let s = 0; s < F.length; s++) if (s !== t) { const k = F[s].indexOf(c); if (k >= 0) return { s, k, t, kt: F[t].indexOf(null) }; }
    }
  }
  for (let t = 0; t < F.length; t++) {
    if (emp(F[t]) < 2) continue;
    for (const c of new Set(F[t].filter(x => x !== null && x >= 0)))
      for (let s = 0; s < F.length; s++) if (s !== t && cnt(F[s], c) === 1) { const k = F[s].indexOf(c); return { s, k, t, kt: F[t].indexOf(null) }; }
  }
  for (let t = 0; t < F.length; t++) if (emp(F[t]) === 3)
    for (let s = 0; s < F.length; s++) if (s !== t) { const k = F[s].findIndex(x => x !== null && x >= 0); if (k >= 0) return { s, k, t, kt: 0 }; }
  // Ein fast leeres Fach ganz leeren, damit die hintere Reihe nachrückt
  for (let s = 0; s < F.length; s++) {
    if (G.shelves[s].layers.length < 2 || emp(F[s]) !== 2) continue;
    const k = F[s].findIndex(x => x !== null && x >= 0); if (k < 0) continue;
    for (let t = 0; t < F.length; t++) if (t !== s && emp(F[t])) return { s, k, t, kt: F[t].indexOf(null) };
  }
  // Sonst irgendein erlaubter Zug
  for (let t = 0; t < F.length; t++) if (emp(F[t])) for (let s = 0; s < F.length; s++) if (s !== t) { const k = F[s].findIndex(x => x !== null && x >= 0); if (k >= 0) return { s, k, t, kt: F[t].indexOf(null) }; }
  return null;
}
function spend(cost) {
  if (save.coins < cost) { toast(TX`Nicht genug Münzen. Im Shop (Demo) gibt es Nachschub.`); return false; }
  save.coins -= cost; persist(); return true;
}
function useUndo() {
  if (busy || !G.history.length) return toast(tx("Noch nichts zum Zurücknehmen."));
  if (!spend(30)) return;
  Object.assign(G, G.history.pop()); G.helped = true; statHelp("u"); sel = null; renderGame(); toast(tx("Zug zurückgenommen"));
}
function useHint() {
  if (busy) return;
  const h = findHint();
  if (!h) return toast(tx("Kein guter Zug in Sicht. Probier „Mischen“."));

function doShuffle() {

  G.shelves.forEach((sh, s) => { if (sh.lock) return; sh.wrap = [false, false, false]; sh.dust = [false, false, false]; coolAll(sh); sh.layers[0].forEach((x, k) => { pos.push([s, k]); if (x !== null) items.push(x); }); });
  let placed;
  for (let tries = 0; tries < 50; tries++) {
    placed = shuffle(pos, rnd);
    G.shelves.forEach(sh => { if (!sh.lock) sh.layers[0] = [null, null, null]; });
    items.forEach((t, i) => { const [s, k] = placed[i]; G.shelves[s].layers[0][k] = t; });
    if (!G.shelves.some(sh => isTriple(sh.layers[0]))) break;

  const h = [...dayKey() + roomId].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7);
  const rnd = mulberry32(h);
  const met = shuffle(REGULARS.filter(r => save.regulars[r.id]).map(r => ({ g: r.g, n: r.n })), rnd);
  const rest = shuffle(GUESTS, rnd).map(g => ({ g, n: "" }));
  const pool = met.slice(0, 1).concat(rest);
  return seats.map((s, i) => ({ ...s, ...pool[i] }));
}

/* ================= Spielstatistik für Tester ================= */
const tstats = () => save.tstats || (save.tstats = { lv: {}, time: 0, sess: 0 });
const lvKey = g => (g.daily ? "T" : g.bonus ? "B" : g.ev ? g.ev.code : "L") + g.n;
const lvStat = g => { const L = tstats().lv, k = lvKey(g); return L[k] || (L[k] = { p: 0, w: 0, l: 0, q: 0, h: {} }); };
function statStart() { lvStat(G).p++; G.t0 = Date.now(); persist(); }
function statEnd(kind) {
  if (!G || G.statDone || !G.t0) return;
  G.statDone = true;
  const r = lvStat(G), secs = Math.round((Date.now() - G.t0) / 1000);
  r[kind]++; tstats().time += secs; persist();
}
function statHelp(k) { if (G) { const h = lvStat(G).h; h[k] = (h[k] || 0) + 1; } }
const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} Std. ${m} Min.` : `${m} Min.`; };
const HELP_NAMES = { u: "Zurück", h: "Tipp", s: "Mischen", e: "Extra-Fach", c: "Weiterspielen", b: "Start-Booster" };
function statHard() {
  return Object.entries(tstats().lv).filter(([, r]) => r.l + r.q > 0).sort((a, b) => (b[1].l + b[1].q) - (a[1].l + a[1].q) || b[1].p - a[1].p).slice(0, 8);
}
function statHelpers() {
  const t = {}; Object.values(tstats().lv).forEach(r => Object.entries(r.h).forEach(([k, v]) => t[k] = (t[k] || 0) + v)); return t;
}
// Kurzer Text zum Mitschicken (bleibt deutsch, damit du ihn lesen kannst)
function statText() {

  return `[Statistik] Version ${VERSION} · Level ${save.level} · ${fmtTime(T.time)} gespielt · ${T.sess} Sitzungen · ${sum("w")} gewonnen, ${sum("l")} verloren, ${sum("q")} abgebrochen · Bildschirm ${innerWidth}×${innerHeight} · ${LANG}\n`

}

/* ================= Wochenziele ================= */
const WEEK_FROM = 5, WEEK_REWARD = [100, 150, 200];
const weekNo = (d = new Date()) => Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 0, 5)) / 6048e5);
const weekDaysLeft = () => 7 - (new Date().getDay() + 6) % 7;
const WEEK_TYPES = [
  { t: "guests", n: [40, 60, 80], d: "Bediene {} Gäste", e: "👵" },
  { t: "sets", n: [50, 70, 90], d: "Räume {} Sets ab", e: "🧺" },
  { t: "wins", n: [5, 7, 10], d: "Schaffe {} Level", e: "⭐" },
  { t: "stars3", n: [3, 4, 5], d: "Hole {}-mal 3 Sterne", e: "🌟" },
  { t: "combo", n: [5, 8, 12], d: "Schaffe {} Kombos", e: "✨" },
  { t: "kind:nasch", n: [4, 6], d: "Bediene {} Naschkatzen", e: "👧", min: 17 },
  { t: "kind:sammler", n: [4, 6], d: "Bediene {} Sammler", e: "🧐", min: 11 },
  { t: "kind:eilig", n: [4, 6], d: "Bediene {} eilige Gäste", e: "🧑‍💼", min: 14 },
  { t: "kind:stamm", n: [3, 5], d: "Bediene {} Stammgäste", e: "💬", min: 6 },
  { t: "puzzle", n: [2, 3], d: "Löse {} Tagesrätsel", e: "🧩", min: 8 },
  { t: "item", n: [6, 9], d: "Räume {} Sets {} ab" }
];
const fillTx = (key, ...v) => { let i = 0; return tx(key).replace(/\{(\d?)\}/g, (m, d) => String(v[d === "" ? i++ : +d])); };
function week() {
  const id = weekNo();
  if (save.week && save.week.id === id) return save.week;
  const rnd = mulberry32(id * 4409 + 11);
  const opts = shuffle(WEEK_TYPES.filter(w => !w.min || save.level >= w.min), rnd).slice(0, 3);
  const goals = opts.map(w => {
    const n = w.n[Math.floor(rnd() * w.n.length)];
    if (w.t === "item") { const it = NORMAL_POOL[Math.floor(rnd() * NORMAL_POOL.length)]; return { t: "item:" + it, n, d: w.d, it }; }
    return { t: w.t, n, d: w.d, e: w.e };
  });
  save.week = { id, goals, prog: [0, 0, 0], claimed: [false, false, false], all: false }; persist();
  return save.week;
}
const goalText = g => g.it !== undefined ? fillTx(g.d, g.n, tx(ITEMS[g.it].n)) : fillTx(g.d, g.n);
const goalIcon = g => g.it !== undefined ? ITEMS[g.it].e : g.e;
function weekAdd(t, k = 1) {
  if (save.level < WEEK_FROM) return;
  const w = week();
  w.goals.forEach((g, i) => {
    if (g.t !== t || w.prog[i] >= g.n) return;
    w.prog[i] = Math.min(g.n, w.prog[i] + k);
    if (w.prog[i] >= g.n) setTimeout(() => toast("📅 " + TX`Wochenziel geschafft: ${goalText(g)}`), 900);
  });
}
const weekDone = () => { const w = week(); return w.goals.filter((g, i) => w.prog[i] >= g.n).length; };
const weekClaimable = () => { if (save.level < WEEK_FROM) return 0; const w = week(); return w.goals.filter((g, i) => w.prog[i] >= g.n && !w.claimed[i]).length + (weekDone() === 3 && !w.all ? 1 : 0); };
function weekButton() {
  if (save.level < WEEK_FROM) return "";
  const c = weekClaimable();
  return `<button class="weekbtn" id="hWeek"><span class="wi">📅</span><span><b>${tx("Wochenziele")}</b><small>${TX`${weekDone()} von 3 geschafft · neue Ziele in ${weekDaysLeft()} Tagen`}</small></span>${c ? `<span class="nbadge">${c}</span>` : `<span class="wch">›</span>`}</button>`;
}
function openWeek() {
  const w = week();
  const rows = w.goals.map((g, i) => {
    const p = Math.min(w.prog[i], g.n), ok = p >= g.n;
    return `<div class="wrow ${ok ? "ok" : ""}"><span class="wi">${goalIcon(g)}</span>
      <span class="wt"><b>${esc(goalText(g))}</b><span class="gbar"><i style="width:${p / g.n * 100}%"></i></span><small>${p}/${g.n}</small></span>
      ${w.claimed[i] ? `<span class="done">✓</span>` : ok ? `<button class="btn small" data-wk="${i}">${tx("Holen")} · 🪙 ${WEEK_REWARD[i]}</button>` : `<em>🪙 ${WEEK_REWARD[i]}</em>`}</div>`;
  }).join("");
  const all = weekDone() === 3;
  const o = overlay(`<div class="card">
    <div style="font-size:40px">📅</div>
    <h2>${tx("Wochenziele")}</h2>
    <p>${TX`Jeden Montag gibt es drei neue Ziele. Noch ${weekDaysLeft()} Tage.`}</p>
    <div class="wlist">${rows}
      <div class="wrow allb ${all ? "ok" : ""}"><span class="wi">🎁</span><span class="wt"><b>${tx("Alle drei geschafft")}</b><small>${tx("Extra-Belohnung")}</small></span>
        ${w.all ? `<span class="done">✓</span>` : all ? `<button class="btn small berry" data-wk="all">${tx("Holen")} · ⭐ 1</button>` : `<em>⭐ 1</em>`}</div></div>
    <button class="btn alt" id="wkClose">${tx("Schließen")}</button>
  </div>`);
  o.querySelectorAll("[data-wk]").forEach(b => b.onclick = () => {
    const k = b.dataset.wk;
    if (k === "all") { if (w.all || weekDone() < 3) return; w.all = true; save.bonus = (save.bonus || 0) + 1; }
    else { const i = +k; if (w.claimed[i] || w.prog[i] < w.goals[i].n) return; w.claimed[i] = true; save.coins += WEEK_REWARD[i]; }
    persist(); sfx("buy"); buzz(20); sparks(b); setTimeout(() => { closeOverlay(); renderHome(); openWeek(); }, 300);
  });
  o.querySelector("#wkClose").onclick = () => { closeOverlay(); renderHome(); };
}

  [SECRET[3].t]: "You looked under the telescope in the attic? Well done!\n\nThere's no recipe page there, but a little map of our garden. With a red cross under the rose arch.\n\nGrandpa drew it. He could never draw straight lines, but the cross is unmistakable.",
  [SECRET[4].t]: "There's a tin box buried under the rose arch. I know you've found it.\n\nIt has two locks. The brass key only fits one. I deliberately entrusted the other to someone who looks after things well.\n\nWho could that be? Someone who has lived across the street for a very long time …",
  [SECRET[5].t]: "Mrs. Krüger gave you the second key, didn't she?\n\nThirty years ago I told her: “Only give it to the one who makes the shop shine again.” She waited three decades – and then she saw you.\n\nNow you have both keys. Almost there.",
  [SECRET[6].t]: "Page 68 is in the box: the recipe for my heart tartlet. Henri shared it only with me, and I promised him that one day I'd pass it on to someone who bakes with their heart.\n\nUnderneath there's another letter. Only read it once the café is completely finished.",
  [SECRET[7].t]: "Now the time has come.\n\nThe heart tartlet was never a secret because it tastes so special. It was a secret because it's meant for the person you entrust with the dearest place in the world.\n\nThe shop, the terrace, the bakehouse, the garden – all of it is yours now. And my recipe too. Bake it for your guests. Henri would be proud. I have been for a long time.\n\nWith love,\nyour Grandma Hilde"
});

function shareText(text, copiedMsg) {
  const copy = () => { try { navigator.clipboard.writeText(text).then(() => toast(copiedMsg || tx("Kopiert")), () => toast(tx("Kopieren ging nicht. Bitte lange auf den Text drücken."))); } catch (e) { toast(tx("Kopieren ging nicht. Bitte lange auf den Text drücken.")); } };
  if (navigator.share && !inFrame()) navigator.share({ text }).catch(e => { if (!e || e.name !== "AbortError") copy(); });
  else copy();
}
function deviceInfo() {
  const ua = navigator.userAgent;
  const ios = ua.match(/(iPhone|iPad|iPod).*? OS (\d+)[_.](\d+)/);
  const os = ios ? `${ios[1]} iOS ${ios[2]}.${ios[3]}` : /Android/.test(ua) ? "Android " + ((ua.match(/Android ([\d.]+)/) || [])[1] || "?")
    : /Mac OS X/.test(ua) ? (navigator.maxTouchPoints > 1 ? "iPad" : "Mac") : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "?";
  const br = /CriOS/.test(ua) ? "Chrome" : /FxiOS|Firefox/.test(ua) ? "Firefox" : /EdgA|EdgiOS|Edg\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet"
    : /Chrome\//.test(ua) ? "Chrome" : /Safari/.test(ua) ? "Safari" : "?";
  const mode = isStandalone() ? tx("App vom Home-Bildschirm") : inFrame() ? tx("eingebettet") : tx("Browser");
  return `${os} · ${br} · ${mode}`;
}
function infoText() {
  const lvName = G ? (G.fam ? tx("Familien-Rätsel") + " " + G.n : G.bonus ? tx("Bonusrunde") : G.daily ? tx("Tagesrätsel") + " #" + G.n : G.ev ? tx(G.ev.n) + " " + G.n : "Level " + G.n) : "";
  return `[Info] Version ${VERSION} · ${new Date().toLocaleString(LANG === "de" ? "de-DE" : "en-GB")} · ${deviceInfo()} · ${innerWidth}×${innerHeight} · ${LANG}`
    + (G ? `\n${tx("Gerade im Spiel")}: ${lvName} · ${TX`Zug ${G.moves}`} · ❤️ ${G.hearts}/${G.maxHearts} · ${tx("Geduld")} ${G.pMax || "–"} s${G.boosts && Object.keys(G.boosts).length ? " · " + Object.keys(G.boosts).join("+") : ""}` : "");
}

const BUG_KINDS = ["Hängt / reagiert nicht", "Sieht komisch aus", "Zu schwer", "Fehler im Text", "Sonstiges"];
function openFeedback(asked, onClose, report = false) {
  const f = save.feedback || (save.feedback = { stars: 0, text: "" });
  let kind = null;
  const o = overlay(`<div class="card">
    <div style="font-size:40px">${report ? "🐞" : "💬"}</div>
    <h2>${tx(report ? "Problem melden" : asked ? "Kurze Frage an dich" : "Feedback")}</h2>
    ${report ? `<p>${tx("Was ist passiert?")}</p>
      <div class="bugkinds">${BUG_KINDS.map((k, i) => `<button class="chip" data-bk="${i}">${tx(k)}</button>`).join("")}</div>`
    : `<p>${tx("Wie gefällt dir Trödel &amp; Törtchen bisher?")}</p>
      <div class="fbstars">${[1, 2, 3, 4, 5].map(i => `<button class="fbs ${i <= f.stars ? "on" : ""}" data-fs="${i}" aria-label="${TX`${i} von 5 Sternen`}">⭐</button>`).join("")}</div>`}
    <textarea id="fbText" rows="4" placeholder="${tx(report ? "Beschreib kurz, was du gemacht hast und was dann passiert ist." : "Was gefällt dir? Was soll besser werden? (freiwillig)")}">${report ? "" : esc(f.text)}</textarea>
    <label class="fbstat"><input type="checkbox" id="fbStat" checked> ${tx("Infos zu Gerät und Spielstand anhängen")}</label>
    <p class="fbinfo">${esc(`Version ${VERSION} · Level ${G ? G.n : save.level} · ${deviceInfo()}`)}</p>
    <button class="btn" id="fbSend">📤 ${tx("Senden (WhatsApp, Mail …)")}</button>
    <p class="fbnote">${tx("Wähle im nächsten Fenster aus, an wen es gehen soll.")}</p>
    <a class="btn alt" id="fbItch" href="${ITCH_URL}#comments" target="_blank" rel="noopener">${tx("Auf itch.io kommentieren")}</a>
    <button class="btn alt" id="fbClose">${tx(asked ? "Später" : "Schließen")}</button>
  </div>`);
  const ta = o.querySelector("#fbText");
  const keep = () => { if (!report) { f.text = ta.value; persist(); } };
  o.querySelectorAll("[data-fs]").forEach(b => b.onclick = () => {
    f.stars = +b.dataset.fs; persist(); sfx("pick");
    o.querySelectorAll("[data-fs]").forEach(x => x.classList.toggle("on", +x.dataset.fs <= f.stars));
  });
  o.querySelectorAll("[data-bk]").forEach(b => b.onclick = () => {
    kind = +b.dataset.bk; sfx("pick"); o.querySelectorAll("[data-bk]").forEach(x => x.classList.toggle("on", x === b));
  });
  const message = () => {
    const head = report ? `🐞 ${tx("Problem")}${kind !== null ? ": " + tx(BUG_KINDS[kind]) : ""}` : f.stars ? "⭐".repeat(f.stars) : "";
    return [`Trödel & Törtchen – ${tx(report ? "Problem melden" : "Feedback")}`, head, ta.value.trim(),
      o.querySelector("#fbStat").checked ? infoText() + "\n" + statText() : ""].filter(Boolean).join("\n\n");
  };
  o.querySelector("#fbSend").onclick = () => {
    if (report && kind === null && !ta.value.trim()) return toast(tx("Wähle oben aus, was passiert ist, oder schreib ein paar Worte."));
    keep(); shareText(message(), tx("Text kopiert – füge ihn jetzt in WhatsApp oder eine Mail ein."));
  };
  o.querySelector("#fbItch").onclick = () => {
    keep();
    try { navigator.clipboard.writeText(message()).then(() => toast(tx("Text kopiert – jetzt auf itch.io einfügen")), () => {}); } catch (e) {}
  };
  o.querySelector("#fbClose").onclick = () => { keep(); closeOverlay(); if (!report && f.stars) toast(tx("Danke für deine Bewertung!")); if (onClose) onClose(); };
}

/* ================= Spielstand sichern und laden ================= */
const b64u = bytes => { let s = ""; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = str => { const s = atob(str.replace(/-/g, "+").replace(/_/g, "/")); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
const pipeBytes = (bytes, stream) => new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(b => new Uint8Array(b));
async function backupCode() {
  const raw = new TextEncoder().encode(JSON.stringify(save));
  if (window.CompressionStream) try { return "TT2-" + b64u(await pipeBytes(raw, new CompressionStream("deflate-raw"))); } catch (e) {}
  return "TT1-" + b64u(raw);
}
async function readBackup(code) {
  const c = (code || "").replace(/\s+/g, ""), m = c.match(/^TT([12])-([A-Za-z0-9_-]+)$/);
  if (!m) throw new Error("format");
  let bytes = unb64u(m[2]);
  if (m[1] === "2") bytes = await pipeBytes(bytes, new DecompressionStream("deflate-raw"));
  const data = JSON.parse(new TextDecoder().decode(bytes));
  if (!data || typeof data.level !== "number") throw new Error("data");
  return data;
}
function openBackup() {
  const o = overlay(`<div class="card backup">
    <div style="font-size:40px">💾</div>
    <h2>${tx("Spielstand sichern")}</h2>
    <p>${tx("Mit diesem Code holst du deinen Fortschritt zurück – auch auf einem neuen Handy oder wenn du das App-Symbol gelöscht hast. Schick ihn dir am besten selbst per WhatsApp oder Mail.")}</p>
    <textarea id="bkCode" rows="3" readonly>…</textarea>
    <button class="btn" id="bkShare">📤 ${tx("Code verschicken")}</button>
    <button class="btn alt" id="bkCopy">📋 ${tx("Code kopieren")}</button>
    <h3 class="ah">${tx("Spielstand laden")}</h3>
    <textarea id="bkIn" rows="3" placeholder="${tx("Gesicherten Code hier einfügen")}"></textarea>
    <button class="btn alt" id="bkLoad">${tx("Spielstand laden")}</button>
    <button class="btn" id="bkClose">${tx("Schließen")}</button>
  </div>`);
  let code = "";
  backupCode().then(c => { code = c; const t = o.querySelector("#bkCode"); if (t) t.value = c; save.backupAt = Date.now(); persist(); });
  const msg = () => `${tx("Mein Spielstand bei Trödel & Törtchen")} (Level ${save.level}, ${new Date().toLocaleDateString(LANG === "de" ? "de-DE" : "en-GB")}):\n\n${code}`;
  o.querySelector("#bkShare").onclick = () => { if (code) shareText(msg(), tx("Code kopiert")); };
  o.querySelector("#bkCopy").onclick = () => { if (!code) return; try { navigator.clipboard.writeText(code).then(() => toast(tx("Code kopiert")), () => o.querySelector("#bkCode").select()); } catch (e) { o.querySelector("#bkCode").select(); } };
  o.querySelector("#bkClose").onclick = closeOverlay;
  o.querySelector("#bkLoad").onclick = async () => {
    const txt = o.querySelector("#bkIn").value, found = (txt.match(/TT[12]-[A-Za-z0-9_-]+/) || [txt])[0];
    let data; try { data = await readBackup(found); } catch (e) { return toast(tx("Dieser Code passt leider nicht. Bitte kopier ihn vollständig.")); }
    const c = overlay(`<div class="card">
      <h2>${tx("Spielstand laden?")}</h2>
      <p>${TX`Dein jetziger Stand (Level ${save.level}) wird durch den gesicherten Stand (Level ${data.level}) ersetzt.`}</p>
      <button class="btn" id="bkYes">${tx("Ja, laden")}</button>
      <button class="btn alt" id="bkNo">${tx("Abbrechen")}</button>
    </div>`);
    c.querySelector("#bkNo").onclick = openBackup;
    c.querySelector("#bkYes").onclick = () => {
      save = Object.assign(fresh(), data); persist();
      c.querySelector(".card").innerHTML = `<h2>${tx("Geladen!")}</h2><p>${tx("Das Spiel startet neu …")}</p>`;
      setTimeout(() => location.reload(), 700);
    };
  };
}

  [ROOM_DONE_LETTERS.laden]: "Look around: this is exactly how my shop looked on its best days. No – even lovelier. Because you furnished it.",
  [ROOM_DONE_LETTERS.terrasse]: "The terrace is a place for balmy evenings again. I can picture Grandpa sitting here with his coffee, waving to everyone.",
  [ROOM_DONE_LETTERS.backstube]: "It smells of fresh bread again. A bakehouse without that smell is just a kitchen – yours is a home now.",
  [ROOM_DONE_LETTERS.dachboden]: "All my memories have their place again. Thank you for unpacking them so gently.",
  [ROOM_DONE_LETTERS.garten]: "My rose garden is in bloom! When you sit here on a summer evening, I'm very close to you.",
  [ROOM_DONE_LETTERS.wintergarten]: "Now everything is finished. Every room tells a story again – and the most beautiful one is yours.",
